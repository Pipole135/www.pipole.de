
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080808">

    <title>Über PIPOLE GROUP</title>

    <meta name="description"
          content="Lerne die Geschichte von PIPOLE GROUP kennen – von Pipo über den Künstlernamen PIPOLE bis zur kreativen Dachmarke.">

    <link rel="stylesheet" href="style.css">

    <style>
        .about-page {
            width: min(1100px, 90%);
            margin: 0 auto;
            padding: 70px 0 90px;
        }

        .about-header {
            text-align: center;
            margin-bottom: 45px;
        }

        .about-logo {
            width: min(280px, 75%);
            max-height: 180px;
            object-fit: contain;
            margin-bottom: 30px;
        }

        .about-header h1 {
            font-size: clamp(2.2rem, 6vw, 4rem);
            margin: 0 0 15px;
            letter-spacing: 3px;
        }

        .about-header p {
            color: #c5c5c5;
            font-size: 1.1rem;
            line-height: 1.8;
        }

        .about-slogan {
            font-weight: bold;
            text-align: center;
        }

        .about-section {
            position: relative;
            margin-bottom: 30px;
            padding: 30px;
            background: rgba(15, 15, 15, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 12px;
            overflow: hidden;
        }

        .about-section::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(
                90deg,
                #ff0000,
                #ff7a00,
                #ffe600,
                #00c853,
                #009dff,
                #6a00ff
            );
        }

        .about-section h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.6rem;
            text-align: center;
        }

        .about-section p {
            color: #d0d0d0;
            line-height: 1.9;
            margin-bottom: 16px;
        }

        .text-left {
            text-align: left;
        }

        .text-center {
            text-align: center;
        }

        .name-formula {
            font-size: 1.2rem;
            letter-spacing: 0.04em;
            margin: 24px 0 !important;
        }

        .about-highlight {
            margin-top: 24px;
            font-size: 1.05rem;
        }

        .about-projects {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 24px;
            margin-top: 28px;
        }

        .about-project {
            position: relative;
            padding: 25px;
            background: rgba(20, 20, 20, 0.94);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            overflow: hidden;
        }

        .about-project::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(
                90deg,
                #ff0000,
                #ff7a00,
                #ffe600,
                #00c853,
                #009dff,
                #6a00ff
            );
        }

        .about-project h3 {
            margin-top: 0;
            letter-spacing: 1px;
            text-align: center;
        }

        .about-project p {
            color: #c5c5c5;
            line-height: 1.7;
        }

        .about-back {
            display: inline-block;
            margin-top: 15px;
            padding: 14px 22px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 7px;
            color: #fff;
            text-decoration: none;
            transition: background 0.2s ease;
        }

        .about-back:hover {
            background: rgba(255, 255, 255, 0.10);
        }

        .about-footer {
            text-align: center;
            margin-top: 35px;
        }

        .about-loading,
        .about-error {
            text-align: center;
            color: #c5c5c5;
            padding: 30px;
        }

        @media (max-width: 700px) {
            .about-page {
                padding-top: 45px;
            }

            .about-section {
                padding: 22px;
            }

            .about-projects {
                grid-template-columns: 1fr;
            }

            .about-project {
                padding: 22px;
            }
        }
    </style>
</head>

<body>
    <main class="about-page">

        <header class="about-header">
            <a href="index.html" aria-label="Zur Startseite">
                <img
                    class="about-logo"
                    src="assets/pipole-group-logo.png"
                    alt="PIPOLE GROUP Logo">
            </a>

            <h1>ÜBER PIPOLE GROUP</h1>
            <p class="about-slogan">7 Leben. Vereint in PIPOLE.</p>
        </header>

        <div id="about-content">
            <p class="about-loading">Die Geschichte von PIPOLE wird geladen …</p>
        </div>

        <footer class="about-footer">
            <a href="index.html" class="about-back">
                ← Zurück zur Startseite
            </a>
        </footer>

    </main>

    <script>
        fetch("ueber-inhalt.html")
            .then(response => {
                if (!response.ok) {
                    throw new Error("Der Inhalt konnte nicht geladen werden.");
                }

                return response.text();
            })
            .then(html => {
                document.getElementById("about-content").innerHTML = html;
            })
            .catch(() => {
                document.getElementById("about-content").innerHTML =
                    '<p class="about-error">Die Geschichte konnte leider nicht geladen werden. Bitte versuche es später erneut.</p>';
            });
    </script>
</body>
</html>
